AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Queue and lambda for sending SMS messages

Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - test
    Description: Environment for deploy
  PhoneNumber:
    Type: String
    Description: Phone number for sending text messages

Mappings:
  EnvironmentMap:
    prod:
      project: sms-queue-service
    test:
      project: sms-queue-service-test

Resources:
  SimpleQueue:
    Type: AWS::SQS::Queue
    Properties:
      ContentBasedDeduplication: true
      FifoQueue: true
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: 'created-by'
          Value: 'sms-queue-service'
        - Key: 'created-for'
          Value: 'dbowland'
        - Key: 'environment'
          Value: !Ref Environment
      VisibilityTimeout: 60

  SQSPayloadProcessor:
    Type: AWS::Serverless::Function
    Properties:
      Description: Processes queued messages to send sms messages.
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Handler: src/handlers/sqs-payload-processor.sqsPayloadProcessorHandler
      Environment:
        Variables:
          PROJECT_ID: !Ref PinpointApplication
          SMS_FROM: !Ref PhoneNumber
          SMS_REGION: us-east-1
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            BatchSize: 7
            Queue: !GetAtt SimpleQueue.Arn
      MemorySize: 1536
      Policies:
        # Give Lambda basic execution Permission
        - AWSLambdaBasicExecutionRole
        # Grant access to SQS queue
        - SQSPollerPolicy:
            QueueName: !GetAtt SimpleQueue.QueueName
        # Access to send messages thru Pinpoint
        - Version: 2012-10-17
          Statement:
            - Action:
                - 'mobiletargeting:Send*'
              Effect: Allow
              Resource: !Sub
                - 'arn:aws:mobiletargeting:us-east-1:${AWS::AccountId}:apps/${ProjectId}/messages'
                - ProjectId: !Ref PinpointApplication
      Tags:
        'created-by': 'sms-queue-service'
        'created-for': 'dbowland'
        'environment': !Ref Environment
      Timeout: 60
      Tracing: Active
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/sqs-payload-processor.ts

  PinpointApplication:
    Type: AWS::Pinpoint::App
    Properties:
      Name: !FindInMap [EnvironmentMap, !Ref Environment, project]
      Tags:
        'created-by': 'sms-queue-service'
        'created-for': 'dbowland'
        'environment': !Ref Environment

  PinpointSms:
    Type: AWS::Pinpoint::SMSChannel
    Properties:
      ApplicationId: !Ref PinpointApplication
      Enabled: true

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: [SQSPayloadProcessor]
    Properties:
      LogGroupName: !Sub /aws/lambda/${SQSPayloadProcessor}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'sms-queue-service'
        - Key: 'created-for'
          Value: 'dbowland'
        - Key: 'environment'
          Value: !Ref Environment

  SmsInboundRawTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: 'created-by'
          Value: 'sms-queue-service'
        - Key: 'created-for'
          Value: 'dbowland'
        - Key: 'environment'
          Value: !Ref Environment

  SmsInboundRawTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowEndUserMessagingSmsPublish
            Effect: Allow
            Principal:
              Service: sms-voice.amazonaws.com
            Action: 'sns:Publish'
            Resource: !Ref SmsInboundRawTopic
            Condition:
              StringEquals:
                'AWS:SourceAccount': !Ref AWS::AccountId
      Topics:
        - !Ref SmsInboundRawTopic

  SmsInboundRoutedTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: 'created-by'
          Value: 'sms-queue-service'
        - Key: 'created-for'
          Value: 'dbowland'
        - Key: 'environment'
          Value: !Ref Environment

  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub
        - '${Project}-registrations'
        - Project: !FindInMap [EnvironmentMap, !Ref Environment, project]
      AttributeDefinitions:
        - AttributeName: phoneNumber
          AttributeType: S
        - AttributeName: ruleKey
          AttributeType: S
      KeySchema:
        - AttributeName: phoneNumber
          KeyType: HASH
        - AttributeName: ruleKey
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: 'created-by'
          Value: 'sms-queue-service'
        - Key: 'created-for'
          Value: 'dbowland'
        - Key: 'environment'
          Value: !Ref Environment

  RouterDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: 'created-by'
          Value: 'sms-queue-service'
        - Key: 'created-for'
          Value: 'dbowland'
        - Key: 'environment'
          Value: !Ref Environment

  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Routes inbound SMS messages to the correct consumer based on registered rules.
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Handler: src/handlers/sms-inbound-router.smsInboundRouterHandler
      Environment:
        Variables:
          REGISTRATIONS_TABLE_NAME: !Ref RegistrationsTable
          ROUTED_TOPIC_ARN: !Ref SmsInboundRoutedTopic
      Events:
        SNSEvent:
          Type: SNS
          Properties:
            Topic: !Ref SmsInboundRawTopic
      MemorySize: 256
      Policies:
        # Give Lambda basic execution Permission
        - AWSLambdaBasicExecutionRole
        # Read access to the registrations table
        - DynamoDBReadPolicy:
            TableName: !Ref RegistrationsTable
        # Publish routed messages
        - Version: 2012-10-17
          Statement:
            - Action:
                - 'sns:Publish'
              Effect: Allow
              Resource: !Ref SmsInboundRoutedTopic
        # Send failed invocations to the dead-letter queue
        - SQSSendMessagePolicy:
            QueueName: !GetAtt RouterDeadLetterQueue.QueueName
      Tags:
        'created-by': 'sms-queue-service'
        'created-for': 'dbowland'
        'environment': !Ref Environment
      Timeout: 30
      Tracing: Active
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/sms-inbound-router.ts

  RouterFunctionEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref RouterFunction
      Qualifier: '$LATEST'
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt RouterDeadLetterQueue.Arn

  RouterLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: [RouterFunction]
    Properties:
      LogGroupName: !Sub /aws/lambda/${RouterFunction}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'sms-queue-service'
        - Key: 'created-for'
          Value: 'dbowland'
        - Key: 'environment'
          Value: !Ref Environment

Outputs:
  SmsInboundRoutedTopicArn:
    Description: SNS topic ARN consumer projects subscribe to for routed inbound SMS messages.
    Value: !Ref SmsInboundRoutedTopic
    Export:
      Name: !Sub '${AWS::StackName}-SmsInboundRoutedTopicArn'
  RegistrationsTableName:
    Description: DynamoDB table name for phone number registrations, written by sms-queue-api.
    Value: !Ref RegistrationsTable
    Export:
      Name: !Sub '${AWS::StackName}-RegistrationsTableName'
